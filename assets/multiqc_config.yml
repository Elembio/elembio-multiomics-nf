custom_logo_title: "Elembio/elembio-multiomics-nf"

report_comment: >
  This report has been generated by the elembio-multiomics-nf
  analysis pipeline.

report_section_order:
  software_versions:
    order: -1000

export_plots: true

# Clean up sample names so all tools report the same sample ID
# Removes suffixes added by various pipeline steps
extra_fn_clean_exts:
  - "_sorted_md"
  - ".star.tagged"
  - ".star.cell"
  - ".star"
  - ".featureCounts"
  - type: regex
    pattern: '_T[0-9]'
  - type: regex
    pattern: '\.ontarget\.[^.]+$'

disable_version_detection: true