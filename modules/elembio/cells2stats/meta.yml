name: cells2stats
description: Generate cell-level statistics from Element AVITI spatial transcriptomics data
keywords:
  - spatial transcriptomics
  - cell statistics
  - aviti
  - element biosciences
tools:
  - cells2stats:
      description: Cell statistics generation tool for Element AVITI24 System
      homepage: https://docs.elembio.io/
      licence: ["Proprietary"]

input:
  - meta:
      type: map
      description: "Groovy map containing run metadata (e.g., `[id: run_id]`)"
  - run_dir:
      type: val
      description: Path to AVITI analysis run directory
  - run_panel:
      type: file
      description: Optional Panel.json file (empty list if not provided)
      pattern: "Panel.json"
  - run_manifest:
      type: file
      description: Optional run manifest file (empty list if not provided)
      pattern: "*.{csv,json}"
  - segmentation:
      type: file
      description: Optional custom cell segmentation directory (empty list if not provided)
  - tca_manifest:
      type: file
      description: |
        Optional TargetCellAssignmentManifest CSV (empty list if not provided).
        Passed to cells2stats via `--tca-manifest`. Previously read from
        `params.c2s_tca_manifest_csv` directly; now a proper channel input
        so the file is staged into the work dir like other path inputs.
      pattern: "*.csv"

output:
  - average_norm_well_stats_csv:
      type: file
      description: Average normalized well statistics
      pattern: "AverageNormWellStats.csv"
  - raw_cell_stats_csv:
      type: file
      description: Raw cell statistics (CSV)
      pattern: "RawCellStats.csv"
  - raw_cell_stats_parquet:
      type: file
      description: Raw cell statistics (Parquet)
      pattern: "RawCellStats.parquet"
  - run_stats_json:
      type: file
      description: Run statistics
      pattern: "RunStats.json"
  - run_parameters_json:
      type: file
      description: Run parameters
      pattern: "RunParameters.json"
  - panel_json:
      type: file
      description: Panel configuration
      pattern: "Panel.json"
  - run_manifest_json:
      type: file
      description: Run manifest (JSON)
      pattern: "RunManifest.json"
  - run_manifest_csv:
      type: file
      description: Run manifest (CSV)
      pattern: "RunManifest.csv"
  - versions_json:
      type: file
      description: Cells2Stats version information
      pattern: "Versions.json"
  - wells_dir:
      type: directory
      description: Per-well output directory
      pattern: "Wells"
  - rawreads_files:
      type: file
      description: |
        Per-tile rawreads parquets under Wells/<well>/<batch>/. Glob-emit so
        downstream consumers can group by (well,batch) without walking Wells/
        on the submitter (brittle on AWS Batch / Fusion / S3 workdirs).
      pattern: "Wells/**/*_rawreads.parquet"
  - cell_segmentation:
      type: directory
      description: Cell segmentation output directory
      pattern: "CellSegmentation"
  - analysis_region:
      type: directory
      description: Per-tile AnalysisRegion mask TIFFs (overlap runs only)
      pattern: "AnalysisRegion"
  - program_logs_tar:
      type: file
      description: Compressed program logs
      pattern: "Logs.tar.gz"
  - program_logs:
      type: directory
      description: Program logs directory
      pattern: "Logs"
  - target_cell_assignment_manifest_csv:
      type: file
      description: Target cell assignment manifest (CSV)
      pattern: "TargetCellAssignmentManifest.csv"
  - target_cell_assignment_manifest_json:
      type: file
      description: Target cell assignment manifest (JSON)
      pattern: "TargetCellAssignmentManifest.json"
  - target_counts_json:
      type: file
      description: Target counts (pre-rc8 filename)
      pattern: "TargetCounts.json"
  - specialized_targeted_counts_json:
      type: file
      description: Target counts (cells2stats 1.4.0-rc8+ filename)
      pattern: "SpecializedTargetedCounts.json"
  - cyto_viz:
      type: file
      description: CytoCanvas session manifest under SpatialData/ (file_version 4.0.0; rc12+)
      pattern: "SpatialData/cyto.viz"
  - cell_shapes:
      type: file
      description: Cell shape store for CytoCanvas (rc12+ zarr zip under SpatialData/)
      pattern: "SpatialData/cell-shapes-zarr.zip"
  - nuclear_shapes:
      type: file
      description: Nuclear shape store for CytoCanvas (rc12+ zarr zip under SpatialData/)
      pattern: "SpatialData/nuclear-shapes-zarr.zip"
  - points:
      type: file
      description: Points store for CytoCanvas (rc12+ zarr zip under SpatialData/)
      pattern: "SpatialData/points-zarr.zip"
  - sdo_index:
      type: file
      description: |
        ZX02 indexes under SpatialData/ for points/shapes/images. Unique
        suffix globs — not `*zarr-index.bin`. Replaces rc11
        `visualization-index.json.gz` / `*-index.json.gz`.
      pattern: "SpatialData/*.{zarr-index.bin,points-zarr-index.bin,cell-shapes-zarr-index.bin,nuclear-shapes-zarr-index.bin}"
  - spatial_data_dir:
      type: directory
      description: |
        c2s-internal SpatialData directory. Emitted as a single path so
        publishDir can copy the entire tree (zip + zarr + viz sidecars) as a
        unit; consumers that need the inner files individually can still use
        `spatial_data_zip` / `spatial_data_zarr`.
      pattern: "SpatialData"
  - spatial_data_zip:
      type: file
      description: SDO archive only (`{run}.zarr.zip`); viz sidecars use exact emits above
      pattern: "SpatialData/*.zarr.zip"
  - spatial_data_zarr:
      type: file
      description: Spatial data zarr store(s)
      pattern: "SpatialData/*.zarr"
  - multiqc_report:
      type: file
      description: MultiQC HTML report
      pattern: "multiqc_report.html"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
  - run_log:
      type: file
      description: Full stdout/stderr log
      pattern: "run.log"
  - metrics_dir:
      type: directory
      description: |
        Curated directory mirroring the small-metadata subset of the cells2stats
        output root. Relative symlinks of top-level regular files that are not
        known-bulk extensions (*.parquet, BAM/CRAM/SAM, FASTQ) and are under a
        100 MB size cap. SpecializedTargetedCounts.json / TargetCounts.json are
        exempt from the size cap. Typical contents include RunStats.json,
        Versions.json, SpecializedTargetedCounts.json / TargetCounts.json,
        AverageNormWellStats.csv, MosaicLayout.json, Logs.tar.gz, run.log,
        Panel.json, RunManifest.{json,csv}, RunParameters.json, and
        TargetCellAssignmentManifest.{json,csv}. For build-spatialdata
        --c2s-dir. Bulk artefacts (RawCellStats.*, Wells/, CellSegmentation/,
        AnalysisRegion/, SpatialData/, and large CytoCanvas sidecars) are excluded.
      pattern: "metrics"

authors:
  - "@brlajoie"
maintainers:
  - "@brlajoie"
